name: Publish Operator Cockpit PWA
on:
  push:
    paths: [".github/workflows/bootstrap.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Extract 37 verified source files
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .github/assets/operator-source.tar.xz.b64 | xz -d > "$RUNNER_TEMP/operator.tar"
          python3 - "$RUNNER_TEMP/operator.tar" <<'PY'
          import pathlib, sys, tarfile
          with tarfile.open(sys.argv[1], "r:") as t:
              items = t.getmembers()
              assert len(items) == 37
              for m in items:
                  path = pathlib.PurePosixPath(m.name)
                  if not m.isfile() or path.is_absolute() or '..' in path.parts or path.parts[0] == '.github':
                      raise SystemExit("Unsafe source file path")
              t.extractall(".", filter="data")
          PY
      - name: Commit source to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "feat: publish complete Operator Cockpit PWA source"
            git push origin HEAD:main
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - run: npm run lint
      - run: npm run build
