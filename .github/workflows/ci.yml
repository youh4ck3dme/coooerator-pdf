name: Operator Cockpit CI

on:
  push:
    branches: [main, 'hardening/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Production dependency security audit
        run: npm run security:runtime
      - name: Lint
        run: npm run lint
      - name: TypeScript and production build
        run: npm run build
      - name: Local PWA smoke tests
        run: npm run smoke
